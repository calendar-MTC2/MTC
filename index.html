
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTC — Martian Time Calendar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 14px;
    background: #FFFFFF;
    color: #26344D;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    text-align: center;
    padding: 25px 0 35px;
}

h1 {
    color: #263B65;
    letter-spacing: 7px;
    font-size: 32px;
    margin: 0 0 10px;
}

.subtitle {
    color: #929DB2;
    font-size: 11px;
    letter-spacing: 4px;
}

.panel {
    background: #F7F8FC;
    border: 1px solid #E3E8F1;
    border-radius: 13px;
    padding: 20px;
    margin-bottom: 20px;
}

.label {
    color: #7282A1;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 17px;
}

.year-control,
.month-control {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.year-control {
    margin-bottom: 28px;
}

.year {
    color: #263B65;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 2px;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.nav {
    background: #E8EDF7;
    color: #344B75;
    border: 1px solid #D5DEED;
    border-radius: 8px;
    padding: 10px 15px;
}

.nav:hover {
    background: #DCE5F5;
}

.month-name {
    font-size: 23px;
    font-weight: bold;
    color: #263B65;
}

.month-select {
    width: 100%;
    margin: 18px 0;
    padding: 12px;
    background: #FFFFFF;
    color: #263B65;
    border: 1px solid #D5DEED;
    border-radius: 8px;
    font-size: 14px;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 7px;
}

.weekday {
    text-align: center;
    color: #8491A9;
    font-size: 11px;
    padding: 12px 0;
    overflow-wrap: anywhere;
}

.day {
    position: relative;
    min-width: 0;
    height: 68px;
    text-align: left;
    padding: 10px;
    color: #34425D;
    background: #FFFFFF;
    border: 1px solid #E1E6EF;
    border-radius: 8px;
    font-size: 15px;
}

.day:hover {
    border-color: #9EAFD2;
    background: #F0F4FB;
}

.day.selected {
    background: #DCE6F8;
    border: 1px solid #829AC5;
    color: #263B65;
}

.day.has-plans::after {
    content: "";
    position: absolute;
    bottom: 8px;
    left: 10px;
    width: 6px;
    height: 6px;
    background: #C4A94E;
    border-radius: 50%;
}

.day.empty {
    visibility: hidden;
    pointer-events: none;
}

.legend {
    color: #8491A9;
    font-size: 11px;
    margin-top: 18px;
}

.legend span {
    color: #C4A94E;
}

#planner {
    display: none;
}

.date-heading {
    font-size: 24px;
    color: #263B65;
    margin-bottom: 7px;
}

.date-sub {
    font-size: 12px;
    color: #8491A9;
}

.progress {
    margin: 22px 0;
    color: #526486;
    font-size: 12px;
}

.progress-bar {
    height: 6px;
    background: #E2E7F0;
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
}

#progressFill {
    height: 100%;
    width: 0%;
    background: #C4A94E;
    transition: width .2s;
}

.hour {
    display: grid;
    grid-template-columns: 95px 1fr 28px;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 8px;
    background: #FFFFFF;
    border: 1px solid #E3E8F1;
    border-radius: 8px;
}

.time {
    color: #526486;
    font-size: 12px;
    font-weight: bold;
}

.task {
    width: 100%;
    min-height: 40px;
    padding: 10px;
    resize: vertical;
    background: #F8F9FC;
    color: #26344D;
    border: 1px solid #DCE2ED;
    border-radius: 7px;
    font-size: 13px;
    outline: none;
}

.task:focus {
    border-color: #91A5CD;
}

.task.done {
    text-decoration: line-through;
    color: #929DB2;
    opacity: .7;
}

.hour.completed {
    border-color: #D8C987;
    background: #FFFDF5;
}

.check {
    width: 18px;
    height: 18px;
    accent-color: #B69A42;
    cursor: pointer;
}

.notes {
    width: 100%;
    min-height: 110px;
    padding: 12px;
    resize: vertical;
    background: #FFFFFF;
    color: #26344D;
    border: 1px solid #DCE2ED;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
}

.notes:focus {
    border-color: #91A5CD;
}

.footer {
    text-align: center;
    color: #9AA5B8;
    font-size: 10px;
    letter-spacing: 3px;
    padding: 25px 0;
}

@media(max-width: 550px) {
    body {
        padding: 12px 8px;
    }

    h1 {
        font-size: 26px;
    }

    .panel {
        padding: 13px;
    }

    .calendar {
        gap: 4px;
    }

    .day {
        height: 49px;
        padding: 7px;
        font-size: 12px;
    }

    .weekday {
        font-size: 9px;
    }

    .month-name {
        font-size: 18px;
    }

    .hour {
        grid-template-columns: 66px 1fr 24px;
        gap: 6px;
        padding: 7px;
    }

    .time {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>MTC</h1>
    <div class="subtitle">MARTIAN TIME CALENDAR</div>
</header>

<!-- CALENDAR -->

<div class="panel">

    <div class="label">
        MARTIAN CALENDAR · 687 DAYS
    </div>

    <div class="year-control">
        <button class="nav" onclick="changeYear(-1)">←</button>
        <div class="year" id="yearDisplay">MY 39</div>
        <button class="nav" onclick="changeYear(1)">→</button>
    </div>

    <div class="month-control">
        <button class="nav" onclick="changeMonth(-1)">←</button>
        <div class="month-name" id="monthDisplay">Велен</div>
        <button class="nav" onclick="changeMonth(1)">→</button>
    </div>

    <select class="month-select"
            id="monthSelect"
            onchange="selectMonth()">
    </select>

    <div class="calendar" id="calendar"></div>

    <div class="legend">
        <span>●</span> Є збережені записи
        <br><br>
        Натисни на дату, щоб відкрити план дня.
    </div>

</div>

<!-- DAILY PLANNER -->

<div class="panel" id="planner">

    <div class="label">DAILY PLANNER</div>

    <div class="date-heading" id="dateHeading"></div>

    <div class="date-sub" id="dateSub"></div>

    <div class="progress">
        <span id="progressText">Виконано: 0 / 24</span>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>
    </div>

    <div class="label" style="margin-top:25px">
        SCHEDULE · 05:00 — 05:00
    </div>

    <div id="schedule"></div>

    <div class="label" style="margin-top:25px">
        IMPORTANT NOTES
    </div>

    <textarea
        class="notes"
        id="notes"
        placeholder="Важливі справи, ідеї, нагадування..."
    ></textarea>

</div>

<div class="footer">
    MTC SYSTEM · MY 39 · 687 DAYS
</div>

</div>

<script>

// ======================================
// 1. MARTIAN CALENDAR CONFIGURATION
// ======================================

const months = [
    ["Арен",30],
    ["Велен",30],
    ["Сорен",30],
    ["Ларен",30],
    ["Марен",30],
    ["Тарен",30],
    ["Норен",30],
    ["Елен",30],
    ["Корен",30],
    ["Дарен",30],
    ["Равен",30],
    ["Мірен",30],
    ["Солен",30],
    ["Варен",30],
    ["Ренен",30],
    ["Кален",30],
    ["Орлен",30],
    ["Савен",30],
    ["Терен",30],
    ["Лорен",30],
    ["Навен",29],
    ["Зарен",29],
    ["Фарен",29]
];

const weekdays = [
    "Аурі",
    "Велар",
    "Сайрен",
    "Норі",
    "Тавер",
    "Елсар",
    "Зорен"
];

// ======================================
// 2. VARIABLES
// ======================================

// Залишено старий ключ, щоб зберегти
// записи з попередньої версії календаря.

const STORAGE_KEY = "MTC_CALENDAR_DATA_V3";

let year = 39;
let month = 1;
let selectedDay = 8;

let data = {};

const calendar = document.getElementById("calendar");
const schedule = document.getElementById("schedule");
const notes = document.getElementById("notes");

// ======================================
// 3. STORAGE
// ======================================

function loadStorage() {
    try {
        data = JSON.parse(
            localStorage.getItem(STORAGE_KEY) || "{}"
        );

        if (!data || typeof data !== "object") {
            data = {};
        }
    } catch {
        data = {};
    }
}

function saveStorage() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}

function dateKey(y, m, d) {
    return `MY${y}-M${m + 1}-D${d}`;
}

// ======================================
// 4. WEEKDAY CALCULATION
// ======================================

// 1 Арен MY39 = Аурі.
// Кожен рік має 687 днів.

function getYearDay(m, d) {
    let total = d;

    for (let i = 0; i < m; i++) {
        total += months[i][1];
    }

    return total;
}

function getWeekday(m, d) {
    const totalDays =
        (year - 39) * 687 +
        getYearDay(m, d) - 1;

    return ((totalDays % 7) + 7) % 7;
}

// ======================================
// 5. CHECK SAVED PLANS
// ======================================

function hasPlans(m, d) {
    const item = data[dateKey(year, m, d)];

    if (!item) return false;

    const tasks = Object.values(item.tasks || {});

    const hasTasks = tasks.some(
        value => String(value).trim() !== ""
    );

    const hasCompleted = Object.values(
        item.completed || {}
    ).some(Boolean);

    const hasNotes = !!(
        item.notes &&
        item.notes.trim()
    );

    return hasTasks || hasCompleted || hasNotes;
}

// ======================================
// 6. MONTH SELECT
// ======================================

const monthSelect = document.getElementById("monthSelect");

months.forEach((item, index) => {
    const option = document.createElement("option");

    option.value = index;

    option.textContent =
        `${index + 1}. ${item[0]} · ${item[1]} днів`;

    monthSelect.appendChild(option);
});

// ======================================
// 7. RENDER CALENDAR
// ======================================

function renderCalendar() {

    document.getElementById("yearDisplay").textContent =
        `MY ${year}`;

    document.getElementById("monthDisplay").textContent =
        months[month][0];

    monthSelect.value = month;

    calendar.innerHTML = "";

    // Days of the week

    weekdays.forEach(name => {
        const element = document.createElement("div");

        element.className = "weekday";
        element.textContent = name;

        calendar.appendChild(element);
    });

    const firstWeekday = getWeekday(month, 1);
    const totalDays = months[month][1];

    // Empty cells

    for (let i = 0; i < firstWeekday; i++) {
        const empty = document.createElement("div");

        empty.className = "day empty";

        calendar.appendChild(empty);
    }

    // All dates

    for (let d = 1; d <= totalDays; d++) {

        const button = document.createElement("button");

        button.type = "button";
        button.className = "day";
        button.textContent = d;

        if (d === selectedDay) {
            button.classList.add("selected");
        }

        if (hasPlans(month, d)) {
            button.classList.add("has-plans");
        }

        button.addEventListener("click", () => {

            selectedDay = d;

            renderCalendar();
            renderPlanner();

            document.getElementById("planner")
                .scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
        });

        calendar.appendChild(button);
    }
}

// ======================================
// 8. MONTH NAVIGATION
// ======================================

function changeMonth(direction) {

    month += direction;

    if (month > 22) {
        month = 0;
        year++;
        selectedDay = 1;
    }

    if (month < 0) {
        month = 22;
        year--;
        selectedDay = 1;
    }

    selectedDay = Math.min(
        selectedDay,
        months[month][1]
    );

    renderCalendar();
    renderPlanner();
}

function selectMonth() {

    month = Number(monthSelect.value);

    selectedDay = Math.min(
        selectedDay,
        months[month][1]
    );

    renderCalendar();
    renderPlanner();
}

// ======================================
// 9. YEAR NAVIGATION
// ======================================

function changeYear(direction) {

    year += direction;

    renderCalendar();
    renderPlanner();
}

// ======================================
// 10. CREATE 24 HOURS
// ======================================

for (let i = 0; i < 24; i++) {

    const start = (5 + i) % 24;
    const end = (6 + i) % 24;

    const hour = document.createElement("div");

    hour.className = "hour";

    const time = document.createElement("div");

    time.className = "time";

    time.textContent =
        String(start).padStart(2, "0") +
        ":00 – " +
        String(end).padStart(2, "0") +
        ":00";

    const task = document.createElement("textarea");

    task.className = "task";
    task.dataset.hour = i;
    task.placeholder = "Запланована справа...";

    const check = document.createElement("input");

    check.type = "checkbox";
    check.className = "check";
    check.dataset.hour = i;

    task.addEventListener("input", saveDay);

    check.addEventListener("change", () => {

        task.classList.toggle(
            "done",
            check.checked
        );

        hour.classList.toggle(
            "completed",
            check.checked
        );

        saveDay();
    });

    hour.append(time, task, check);

    schedule.appendChild(hour);
}

// ======================================
// 11. SAVE DAY
// ======================================

function saveDay() {

    const key = dateKey(year, month, selectedDay);

    const tasks = {};
    const completed = {};

    document.querySelectorAll(".task").forEach(element => {
        tasks[element.dataset.hour] = element.value;
    });

    document.querySelectorAll(".check").forEach(element => {
        completed[element.dataset.hour] = element.checked;
    });

    data[key] = {
        tasks: tasks,
        completed: completed,
        notes: notes.value
    };

    saveStorage();

    updateProgress();
    renderCalendar();
}

// ======================================
// 12. LOAD SELECTED DATE
// ======================================

function renderPlanner() {

    document.getElementById("planner").style.display =
        "block";

    document.getElementById("dateHeading").textContent =
        `${selectedDay} ${months[month][0]} · MY ${year}`;

    document.getElementById("dateSub").textContent =
        `День тижня: ${weekdays[getWeekday(month, selectedDay)]}`;

    const item = data[dateKey(year, month, selectedDay)] || {};

    const tasks = item.tasks || {};
    const completed = item.completed || {};

    document.querySelectorAll(".task").forEach(element => {

        const i = element.dataset.hour;

        element.value = tasks[i] || "";

        element.classList.toggle(
            "done",
            !!completed[i]
        );

        const check = document.querySelector(
            `.check[data-hour="${i}"]`
        );

        check.checked = !!completed[i];

        element.parentElement.classList.toggle(
            "completed",
            !!completed[i]
        );
    });

    notes.value = item.notes || "";

    updateProgress();
}

// ======================================
// 13. PROGRESS BAR
// ======================================

function updateProgress() {

    const checks = [
        ...document.querySelectorAll(".check")
    ];

    const done = checks.filter(
        element => element.checked
    ).length;

    document.getElementById("progressText").textContent =
        `Виконано: ${done} / 24 годин`;

    document.getElementById("progressFill").style.width =
        (done / 24 * 100) + "%";
}

// ======================================
// 14. NOTES AUTOSAVE
// ======================================

notes.addEventListener("input", saveDay);

// ======================================
// 15. INITIALIZATION
// ======================================

loadStorage();

renderCalendar();
renderPlanner();

</script>

</body>
</html>
